name: "Godot Build & Publish to Itch.io"

on:
  push:
    branches:
      - master

env:
  GODOT_VERSION: "4.7"
  ITCH_USERNAME: "karthikkrazy"
  ITCH_GAME_ID: "first-godot"

jobs:
  export-and-upload:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Export Game with Godot
        id: export
        uses: firebelley/godot-export@v6.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          relative_project_path: "./"
          archive_output: false

      - name: Locate Web Build Folder
        id: locate
        run: |
          BUILD_DIR="${{ steps.export.outputs.build_directory }}"
          echo "build_directory=$BUILD_DIR"
          find "$BUILD_DIR" -name index.html | while read f; do echo "FOUND: $f"; done
          WEB_DIR=$(dirname "$(find "$BUILD_DIR" -name index.html | head -n1)")
          echo "web_dir=$WEB_DIR" >> "$GITHUB_ENV"

      - name: Install Butler
        run: |
          curl -L -o /tmp/butler.zip https://github.com/itchio/butler/releases/download/v15.30.0/butler-linux-amd64.zip
          unzip -o /tmp/butler.zip -d /usr/local/bin/
          chmod +x /usr/local/bin/butler
          butler version

      - name: Publish to Itch.io
        run: butler push "$WEB_DIR" "${{ env.ITCH_USERNAME }}/${{ env.ITCH_GAME_ID }}:html5"
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_CREDENTIALS }}